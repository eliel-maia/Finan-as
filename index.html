<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Financeira PWA</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22Agenda Financeira%22,
        %22short_name%22: %22Finanças%22,
        %22start_url%22: %22./index.html%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23121212%22,
        %22theme_color%22: %22%231f2937%22,
        %22icons%22: [
            {
                %22src%22: %22https://cdn-icons-png.flaticon.com/512/3135/3135706.png%22,
                %22sizes%22: %22512x512%22,
                %22type%22: %22image/png%22
            }
        ]
    }">
    <meta name="theme-color" content="#121212">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1e1e1e',
                        paidGreen: '#059669',
                        pendingOrange: '#d97706',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dexie.js (IndexedDB wrapper) -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans select-none relative">

    <!-- Header -->
    <header class="bg-[#18181b] border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="menuBtn" class="text-gray-400 hover:text-white focus:outline-none text-xl p-1">
                <i class="fa-solid fa-bars"></i>
            </button>
            <!-- Botão do Seletor de Mês/Ano -->
            <button id="monthSelectorBtn" class="flex items-center space-x-2 focus:outline-none group py-1 px-2 rounded-lg hover:bg-gray-800 transition-colors">
                <h1 id="currentMonthYear" class="text-lg font-bold tracking-wide text-white capitalize">Outubro 2026</h1>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400 group-hover:text-white transition-transform duration-200" id="chevronIcon"></i>
            </button>
        </div>

        <div class="flex items-center">
            <button id="todayBtn" class="border border-gray-700 rounded px-3 py-1 text-xs font-semibold text-gray-300 hover:bg-gray-800 transition-colors">
                Hoje
            </button>
        </div>
    </header>

    <!-- Menu Lateral (Drawer) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity"></div>
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-[#18181b] border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-5 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white text-sm">Finanças PWA</h2>
                    <p class="text-xs text-gray-400">Controle de Agenda</p>
                </div>
            </div>
            <button id="closeSidebarBtn" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="p-4 flex-1 space-y-2">
            <button id="menuReportsBtn" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-gray-800 hover:text-white transition-colors text-sm font-medium">
                <i class="fa-solid fa-chart-pie text-indigo-400 w-5"></i>
                <span>Relatórios Financeiros</span>
            </button>
        </div>

        <div class="p-4 border-t border-gray-800 text-xs text-center text-gray-500">
            Agenda Financeira v1.0
        </div>
    </aside>

    <!-- Modal de Relatórios -->
    <div id="reportsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-5 border-b border-gray-800 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-chart-pie text-indigo-400"></i>
                    <span>Relatório do Mês</span>
                </h2>
                <button id="closeReportsBtn" class="text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium uppercase">Total Pago</p>
                        <p id="reportPaid" class="text-xl font-bold text-emerald-500 mt-1">R$ 0,00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                        <i class="fa-solid fa-check text-lg"></i>
                    </div>
                </div>

                <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium uppercase">Total Pendente</p>
                        <p id="reportPending" class="text-xl font-bold text-amber-500 mt-1">R$ 0,00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center">
                        <i class="fa-solid fa-clock text-lg"></i>
                    </div>
                </div>

                <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex items-center justify-between border-t-2 border-t-indigo-500">
                    <div>
                        <p class="text-xs text-gray-400 font-medium uppercase">Total Geral do Mês</p>
                        <p id="reportTotal" class="text-xl font-bold text-white mt-1">R$ 0,00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                        <i class="fa-solid fa-wallet text-lg"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dropdown / Modal de Seleção de Meses -->
    <div id="monthPickerDropdown" class="absolute top-16 left-4 bg-cardBg border border-gray-700 rounded-2xl shadow-2xl p-4 z-40 hidden w-72 animate-in fade-in zoom-in duration-200">
        <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-800">
            <button id="prevYearBtn" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="pickerYearLabel" class="text-base font-bold text-white">2026</span>
            <button id="nextYearBtn" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-3 gap-2" id="monthsGrid">
            <!-- Gerado via JS -->
        </div>
    </div>

    <!-- Sub-header: Days of the week -->
    <div class="grid grid-cols-7 bg-[#18181b] border-b border-gray-800 text-center text-xs font-medium text-gray-400 py-2 sticky top-[57px] z-20">
        <div>dom.</div>
        <div>seg.</div>
        <div>ter.</div>
        <div>qua.</div>
        <div>qui.</div>
        <div>sex.</div>
        <div>sáb.</div>
    </div>

    <!-- Main Calendar Grid Container -->
    <main class="flex-1 overflow-y-auto pb-24">
        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr min-h-[calc(100vh-120px)] border-l border-gray-800">
            <!-- Gerado via JavaScript -->
        </div>
    </main>

    <!-- Floating Action Button (+) -->
    <button id="openModalBtn" class="fixed right-5 bottom-6 w-14 h-14 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl z-30 focus:outline-none transition-transform active:scale-95">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal de Cadastro / Edição -->
    <div id="transactionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-5">
                <h2 id="modalTitle" class="text-lg font-bold text-white">Nova Conta</h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="transactionForm" class="space-y-4">
                <input type="hidden" id="transactionId">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Nome da Conta / Despesa</label>
                    <input type="text" id="nameInput" required placeholder="Ex: Nubank, Aluguel, Academia" 
                        class="w-full bg-[#121212] border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Valor (R$)</label>
                        <input type="number" step="0.01" id="amountInput" required placeholder="0,00" 
                            class="w-full bg-[#121212] border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Data de Vencimento</label>
                        <input type="date" id="dateInput" required 
                            class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Status</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border border-gray-700 rounded-xl p-3 flex items-center justify-center space-x-2 cursor-pointer hover:border-gray-500 has-[:checked]:border-pendingOrange has-[:checked]:bg-pendingOrange/10">
                            <input type="radio" name="status" value="pending" checked class="text-pendingOrange focus:ring-0">
                            <span class="text-sm font-medium text-amber-500">Pendente</span>
                        </label>
                        <label class="border border-gray-700 rounded-xl p-3 flex items-center justify-center space-x-2 cursor-pointer hover:border-gray-500 has-[:checked]:border-paidGreen has-[:checked]:bg-paidGreen/10">
                            <input type="radio" name="status" value="paid" class="text-paidGreen focus:ring-0">
                            <span class="text-sm font-medium text-emerald-500">Pago</span>
                        </label>
                    </div>
                </div>

                <div class="flex space-x-3 pt-3">
                    <button type="button" id="deleteBtn" class="hidden bg-red-600/20 hover:bg-red-600/30 text-red-400 px-4 py-3 rounded-xl font-medium text-sm transition-colors">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl text-sm shadow-lg transition-colors">
                        Salvar Conta
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const db = new Dexie('FinanceAgendaDB');
        db.version(1).stores({
            transactions: '++id, name, amount, date, status'
        });

        let currentDate = new Date(2026, 9, 1); // Outubro 2026
        let pickerYear = currentDate.getFullYear();

        const monthNames = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", 
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        const calendarGrid = document.getElementById('calendarGrid');
        const currentMonthYearEl = document.getElementById('currentMonthYear');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const transactionModal = document.getElementById('transactionModal');
        const transactionForm = document.getElementById('transactionForm');
        const deleteBtn = document.getElementById('deleteBtn');
        const modalTitle = document.getElementById('modalTitle');
        const monthSelectorBtn = document.getElementById('monthSelectorBtn');
        const monthPickerDropdown = document.getElementById('monthPickerDropdown');
        const pickerYearLabel = document.getElementById('pickerYearLabel');
        const monthsGrid = document.getElementById('monthsGrid');

        // Elementos do Menu e Relatórios
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const menuReportsBtn = document.getElementById('menuReportsBtn');
        const reportsModal = document.getElementById('reportsModal');
        const closeReportsBtn = document.getElementById('closeReportsBtn');

        document.addEventListener('DOMContentLoaded', async () => {
            await seedInitialDataIfNeeded();
            renderCalendar();
            registerServiceWorker();
        });

        async function seedInitialDataIfNeeded() {
            const count = await db.transactions.count();
            if (count === 0) {
                const sampleData = [
                    { name: 'Nubank', amount: 350.00, date: '2026-10-27', status: 'paid' },
                    { name: 'Celular', amount: 69.90, date: '2026-10-01', status: 'pending' },
                    { name: 'RecargaP', amount: 30.00, date: '2026-10-01', status: 'paid' },
                    { name: 'Jejum', amount: 0, date: '2026-10-04', status: 'pending' },
                    { name: 'Ipanema', amount: 120.00, date: '2026-10-08', status: 'paid' },
                    { name: 'Itaú', amount: 450.00, date: '2026-10-08', status: 'paid' },
                    { name: 'Caixa', amount: 800.00, date: '2026-10-10', status: 'paid' },
                    { name: 'Faculdade', amount: 650.00, date: '2026-10-10', status: 'paid' },
                    { name: 'Terreno', amount: 500.00, date: '2026-10-10', status: 'pending' },
                    { name: 'Google One', amount: 14.99, date: '2026-10-12', status: 'paid' },
                    { name: 'Água / Luz', amount: 210.50, date: '2026-10-13', status: 'paid' },
                    { name: 'Bradesco', amount: 320.00, date: '2026-10-13', status: 'paid' },
                    { name: 'Netflix', amount: 55.90, date: '2026-10-13', status: 'paid' },
                    { name: 'Nubank', amount: 420.00, date: '2026-10-27', status: 'pending' }
                ];
                await db.transactions.bulkAdd(sampleData);
            }
        }

        async function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            currentMonthYearEl.textContent = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();

            const startDateStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
            const endDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(totalDays).padStart(2, '0')}`;
            
            const transactions = await db.transactions
                .where('date')
                .between(startDateStr, endDateStr + '\uffff', true, true)
                .toArray();

            const txByDay = {};
            transactions.forEach(tx => {
                const dayNum = parseInt(tx.date.split('-')[2], 10);
                if (!txByDay[dayNum]) txByDay[dayNum] = [];
                txByDay[dayNum].push(tx);
            });

            let cellsHTML = '';

            for (let i = firstDayIndex; i > 0; i--) {
                const dayNum = prevTotalDays - i + 1;
                cellsHTML += `
                    <div class="border-b border-r border-gray-800/60 p-1 min-h-[100px] bg-[#121212]/40 opacity-40">
                        <span class="text-xs text-gray-500 font-semibold px-1">${dayNum}</span>
                    </div>
                `;
            }

            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                const dayTxs = txByDay[day] || [];

                let txBadges = '';
                dayTxs.forEach(tx => {
                    const bgClass = tx.status === 'paid' ? 'bg-paidGreen/90 text-white' : 'bg-pendingOrange/90 text-white';
                    txBadges += `
                        <div onclick="openEditModal(${tx.id})" class="${bgClass} text-[11px] font-medium px-1.5 py-0.5 rounded mb-1 truncate cursor-pointer shadow-sm hover:opacity-80 transition-opacity flex items-center justify-between">
                            <span class="truncate">${tx.name}</span>
                        </div>
                    `;
                });

                cellsHTML += `
                    <div onclick="openAddModalForDate(${day})" class="border-b border-r border-gray-800 p-1 min-h-[105px] bg-darkBg hover:bg-[#1a1a1a] transition-colors cursor-pointer flex flex-col">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-bold px-1.5 py-0.5 rounded-full ${isToday ? 'bg-blue-600 text-white' : 'text-gray-400'}">${day}</span>
                        </div>
                        <div class="flex-1 overflow-y-auto space-y-1">
                            ${txBadges}
                        </div>
                    </div>
                `;
            }

            calendarGrid.innerHTML = cellsHTML;
        }

        // Lógica do Menu Lateral (Drawer)
        function toggleSidebar() {
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            } else {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            }
        }

        menuBtn.addEventListener('click', toggleSidebar);
        closeSidebarBtn.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // Lógica de Relatórios
        async function openReports() {
            toggleSidebar();
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const startDateStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
            const endDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(totalDays).padStart(2, '0')}`;
            
            const transactions = await db.transactions
                .where('date')
                .between(startDateStr, endDateStr + '\uffff', true, true)
                .toArray();

            let paidSum = 0;
            let pendingSum = 0;

            transactions.forEach(tx => {
                const amount = parseFloat(tx.amount) || 0;
                if (tx.status === 'paid') {
                    paidSum += amount;
                } else {
                    pendingSum += amount;
                }
            });

            const totalSum = paidSum + pendingSum;

            document.getElementById('reportPaid').textContent = `R$ ${paidSum.toFixed(2)}`;
            document.getElementById('reportPending').textContent = `R$ ${pendingSum.toFixed(2)}`;
            document.getElementById('reportTotal').textContent = `R$ ${totalSum.toFixed(2)}`;

            reportsModal.classList.remove('hidden');
        }

        menuReportsBtn.addEventListener('click', openReports);
        closeReportsBtn.addEventListener('click', () => {
            reportsModal.classList.add('hidden');
        });

        // Lógica do Seletor de Meses
        function renderMonthPicker() {
            pickerYearLabel.textContent = pickerYear;
            monthsGrid.innerHTML = '';
            
            const currentSelectedMonth = currentDate.getMonth();
            const currentSelectedYear = currentDate.getFullYear();

            monthNames.forEach((m, index) => {
                const isSelected = index === currentSelectedMonth && pickerYear === currentSelectedYear;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `py-2 text-xs font-semibold rounded-xl transition-colors ${
                    isSelected 
                        ? 'bg-indigo-600 text-white shadow-md' 
                        : 'bg-[#121212] text-gray-300 hover:bg-gray-800'
                }`;
                btn.textContent = m.substring(0, 3);
                btn.addEventListener('click', () => {
                    currentDate = new Date(pickerYear, index, 1);
                    monthPickerDropdown.classList.add('hidden');
                    renderCalendar();
                });
                monthsGrid.appendChild(btn);
            });
        }

        monthSelectorBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            pickerYear = currentDate.getFullYear();
            renderMonthPicker();
            monthPickerDropdown.classList.toggle('hidden');
        });

        document.getElementById('prevYearBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            pickerYear--;
            renderMonthPicker();
        });

        document.getElementById('nextYearBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            pickerYear++;
            renderMonthPicker();
        });

        document.addEventListener('click', (e) => {
            if (!monthPickerDropdown.contains(e.target) && !monthSelectorBtn.contains(e.target)) {
                monthPickerDropdown.classList.add('hidden');
            }
        });

        // Controle do Modal de Contas
        function openAddModalForDate(day) {
            const year = currentDate.getFullYear();
            const month = String(currentDate.getMonth() + 1).padStart(2, '0');
            const dayStr = String(day).padStart(2, '0');
            
            document.getElementById('transactionId').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('dateInput').value = `${year}-${month}-${dayStr}`;
            document.querySelector('input[name="status"][value="pending"]').checked = true;
            
            modalTitle.textContent = 'Nova Conta';
            deleteBtn.classList.add('hidden');
            transactionModal.classList.remove('hidden');
        }

        openModalBtn.addEventListener('click', () => {
            const todayStr = currentDate.toISOString().split('T')[0];
            document.getElementById('transactionId').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('amountInput').value = '';
            document.getElementById('dateInput').value = todayStr;
            document.querySelector('input[name="status"][value="pending"]').checked = true;
            
            modalTitle.textContent = 'Nova Conta';
            deleteBtn.classList.add('hidden');
            transactionModal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            transactionModal.classList.add('hidden');
        });

        window.openEditModal = async function(id) {
            event.stopPropagation();
            const tx = await db.transactions.get(id);
            if (!tx) return;

            document.getElementById('transactionId').value = tx.id;
            document.getElementById('nameInput').value = tx.name;
            document.getElementById('amountInput').value = tx.amount;
            document.getElementById('dateInput').value = tx.date;
            document.querySelector(`input[name="status"][value="${tx.status}"]`).checked = true;

            modalTitle.textContent = 'Editar Conta';
            deleteBtn.classList.remove('hidden');
            transactionModal.classList.remove('hidden');
        };

        transactionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('transactionId').value;
            const name = document.getElementById('nameInput').value;
            const amount = parseFloat(document.getElementById('amountInput').value);
            const date = document.getElementById('dateInput').value;
            const status = document.querySelector('input[name="status"]:checked').value;

            if (id) {
                await db.transactions.update(parseInt(id), { name, amount, date, status });
            } else {
                await db.transactions.add({ name, amount, date, status });
            }

            transactionModal.classList.add('hidden');
            renderCalendar();
        });

        deleteBtn.addEventListener('click', async () => {
            const id = document.getElementById('transactionId').value;
            if (id && confirm('Deseja realmente excluir esta conta?')) {
                await db.transactions.delete(parseInt(id));
                transactionModal.classList.add('hidden');
                renderCalendar();
            }
        });

        // Botão Hoje
        document.getElementById('todayBtn').addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar();
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', (e) => {
                        e.waitUntil(clients.claim());
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((resp) => resp || fetch(e.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log("Service Worker registrado com sucesso!"))
                    .catch((err) => console.log("Erro ao registrar Service Worker:", err));
            }
        }
    </script>
</body>
</html>
