<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Financeira PWA</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#121212">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1e1e1e',
                        paidGreen: '#059669',
                        pendingOrange: '#d97706',
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dexie.js (IndexedDB wrapper) -->
    <script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col font-sans select-none relative overflow-hidden">

    <!-- Header -->
    <header class="bg-[#18181b] border-b border-gray-800 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="menuBtn" class="text-gray-400 hover:text-white focus:outline-none text-xl p-1">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button id="monthSelectorBtn" class="flex items-center space-x-2 focus:outline-none group py-1 px-2 rounded-lg hover:bg-gray-800 transition-colors">
                <h1 id="currentMonthYear" class="text-lg font-bold tracking-wide text-white capitalize">Outubro 2026</h1>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400 group-hover:text-white transition-transform duration-200" id="chevronIcon"></i>
            </button>
        </div>

        <div class="flex items-center">
            <button id="todayBtn" class="border border-gray-700 rounded px-3 py-1 text-xs font-semibold text-gray-300 hover:bg-gray-800 transition-colors">
                Hoje
            </button>
        </div>
    </header>

    <!-- Menu Lateral (Drawer) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity"></div>
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-80 bg-[#18181b] border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-5 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h2 class="font-bold text-white text-base">Finanças PWA</h2>
                    <p class="text-xs text-gray-400">Controle de Agenda</p>
                </div>
            </div>
            <button id="closeSidebarBtn" class="text-gray-400 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div class="p-4 flex-1 space-y-3">
            <button id="menuReportsBtn" class="w-full flex items-center space-x-4 px-4 py-3.5 rounded-xl text-gray-200 hover:bg-gray-800 hover:text-white transition-colors text-base font-medium">
                <i class="fa-solid fa-chart-pie text-indigo-400 w-6 text-center text-lg"></i>
                <span class="text-left flex-1">Relatórios Financeiros</span>
            </button>
            <button id="menuExportBtn" class="w-full flex items-center space-x-4 px-4 py-3.5 rounded-xl text-gray-200 hover:bg-gray-800 hover:text-white transition-colors text-base font-medium">
                <i class="fa-solid fa-file-arrow-down text-emerald-400 w-6 text-center text-lg"></i>
                <span class="text-left flex-1">Exportar Backup (JSON)</span>
            </button>
            <label class="w-full flex items-center space-x-4 px-4 py-3.5 rounded-xl text-gray-200 hover:bg-gray-800 hover:text-white transition-colors text-base font-medium cursor-pointer">
                <i class="fa-solid fa-file-arrow-up text-amber-400 w-6 text-center text-lg"></i>
                <span class="text-left flex-1">Restaurar Backup</span>
                <input type="file" id="importFile" accept=".json,application/json" class="hidden">
            </label>
        </div>

        <div class="p-4 border-t border-gray-800 text-xs text-center text-gray-500">
            Agenda Financeira v1.7
        </div>
    </aside>

    <!-- Modal de Relatórios -->
    <div id="reportsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative animate-in fade-in zoom-in duration-200 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5 border-b border-gray-800 pb-3">
                <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-chart-pie text-indigo-400"></i>
                    <span>Relatório do Mês</span>
                </h2>
                <button id="closeReportsBtn" class="text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium uppercase">Total Pago</p>
                        <p id="reportPaid" class="text-xl font-bold text-emerald-500 mt-1">R$ 0,00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center">
                        <i class="fa-solid fa-check text-lg"></i>
                    </div>
                </div>

                <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-400 font-medium uppercase">Total Pendente</p>
                        <p id="reportPending" class="text-xl font-bold text-amber-500 mt-1">R$ 0,00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center">
                        <i class="fa-solid fa-clock text-lg"></i>
                    </div>
                </div>

                <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex items-center justify-between border-t-2 border-t-indigo-500">
                    <div>
                        <p class="text-xs text-gray-400 font-medium uppercase">Total Geral do Mês</p>
                        <p id="reportTotal" class="text-xl font-bold text-white mt-1">R$ 0,00</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                        <i class="fa-solid fa-wallet text-lg"></i>
                    </div>
                </div>

                <!-- Resumo por Categoria -->
                <div class="pt-2">
                    <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">Gastos por Categoria</h3>
                    <div id="categorySummaryList" class="space-y-2">
                        <!-- Gerado dinamicamente via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dropdown de Seleção de Meses -->
    <div id="monthPickerDropdown" class="absolute top-16 left-4 bg-cardBg border border-gray-700 rounded-2xl shadow-2xl p-4 z-40 hidden w-72 animate-in fade-in zoom-in duration-200">
        <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-800">
            <button id="prevYearBtn" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="pickerYearLabel" class="text-base font-bold text-white">2026</span>
            <button id="nextYearBtn" class="text-gray-400 hover:text-white p-2"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="grid grid-cols-3 gap-2" id="monthsGrid"></div>
    </div>

    <!-- Dias da Semana -->
    <div class="grid grid-cols-7 bg-[#18181b] border-b border-gray-800 text-center text-xs font-medium text-gray-400 py-2 sticky top-[57px] z-20">
        <div>dom.</div>
        <div>seg.</div>
        <div>ter.</div>
        <div>qua.</div>
        <div>qui.</div>
        <div>sex.</div>
        <div>sáb.</div>
    </div>

    <!-- Indicador de Pull-to-Refresh -->
    <div id="pullToRefreshIndicator" class="w-full flex items-center justify-center text-indigo-400 text-xs font-medium bg-darkBg transition-all duration-200 overflow-hidden h-0 opacity-0">
        <i class="fa-solid fa-rotate animate-spin mr-2"></i> Solte para atualizar...
    </div>

    <!-- Grade do Calendário -->
    <main id="swipeContainer" class="flex-1 overflow-y-auto pb-24 touch-pan-y">
        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr min-h-[calc(100vh-120px)] border-l border-gray-800"></div>
    </main>

    <!-- Botão Adicionar -->
    <button id="openModalBtn" class="fixed right-5 bottom-6 w-14 h-14 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl z-30 focus:outline-none transition-transform active:scale-95">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal de Cadastro / Edição -->
    <div id="transactionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-gray-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5">
                <h2 id="modalTitle" class="text-lg font-bold text-white">Nova Conta</h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="transactionForm" class="space-y-4">
                <input type="hidden" id="transactionId">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Nome da Conta / Despesa</label>
                    <input type="text" id="nameInput" required placeholder="Ex: Aluguel, Supermercado" 
                        class="w-full bg-[#121212] border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Valor (R$)</label>
                        <input type="text" inputmode="decimal" id="amountInput" required placeholder="0,00" 
                            class="w-full bg-[#121212] border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Data Vencimento</label>
                        <input type="date" id="dateInput" required 
                            class="w-full bg-[#121212] border border-gray-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Categoria</label>
                    <select id="categoryInput" class="w-full bg-[#121212] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm">
                        <option value="Alimentação">Alimentação</option>
                        <option value="Aluguel">Aluguel</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Comunicação">Comunicação</option>
                        <option value="Dívida">Dívida</option>
                        <option value="Dízimo">Dízimo</option>
                        <option value="Educação">Educação</option>
                        <option value="Empréstimo">Empréstimo</option>
                        <option value="Entretenimento">Entretenimento</option>
                        <option value="Financiamento">Financiamento</option>
                        <option value="Internet">Internet</option>
                        <option value="Investimento">Investimento</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Outros" selected>Outros</option>
                        <option value="Salário">Salário</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Veículo">Veículo</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Status</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border border-gray-700 rounded-xl p-3 flex items-center justify-center space-x-2 cursor-pointer hover:border-gray-500 has-[:checked]:border-pendingOrange has-[:checked]:bg-pendingOrange/10">
                            <input type="radio" name="status" value="pending" checked class="text-pendingOrange focus:ring-0">
                            <span class="text-sm font-medium text-amber-500">Pendente</span>
                        </label>
                        <label class="border border-gray-700 rounded-xl p-3 flex items-center justify-center space-x-2 cursor-pointer hover:border-gray-500 has-[:checked]:border-paidGreen has-[:checked]:bg-paidGreen/10">
                            <input type="radio" name="status" value="paid" class="text-paidGreen focus:ring-0">
                            <span class="text-sm font-medium text-emerald-500">Pago</span>
                        </label>
                    </div>
                </div>

                <div id="recurrenceSection" class="bg-[#121212] border border-gray-800 rounded-xl p-4 space-y-3">
                    <label class="block text-xs font-semibold text-gray-400 uppercase">Repetição / Recorrência</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="border border-gray-700 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer hover:border-gray-500 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-500/10">
                            <input type="radio" name="recurrenceType" value="single" checked class="text-indigo-600 focus:ring-0">
                            <span class="text-xs font-medium text-gray-300">Apenas este mês</span>
                        </label>
                        <label class="border border-gray-700 rounded-xl p-2.5 flex items-center justify-center space-x-2 cursor-pointer hover:border-gray-500 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-500/10">
                            <input type="radio" name="recurrenceType" value="multiple" class="text-indigo-600 focus:ring-0">
                            <span class="text-xs font-medium text-gray-300">Repetir / Parcelar</span>
                        </label>
                    </div>

                    <div id="installmentsContainer" class="hidden pt-2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Quantidade de Meses</label>
                        <input type="number" id="installmentsInput" min="2" max="60" value="12" 
                            class="w-full bg-cardBg border border-gray-700 rounded-xl px-4 py-2.5 text-white placeholder-gray-600 focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                </div>

                <div class="flex space-x-3 pt-3">
                    <button type="button" id="deleteBtn" class="hidden bg-red-600/25 hover:bg-red-600/40 text-red-400 px-4 py-3 rounded-xl font-medium text-sm transition-colors">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl text-sm shadow-lg transition-colors">
                        Salvar Conta
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Principal -->
    <script src="./app.js"></script>
</body>
</html>
