<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Controle Financeiro - Agenda</title>
  
  <!-- Manifest Dinâmico para PWA -->
  <link rel="manifest" id="pwa-manifest" />
  <meta name="theme-color" content="#121318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Dexie.js (IndexedDB Wrapper) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appDark: '#121318',
            appCard: '#1a1b23',
            appHeader: '#181920',
            paidGreen: '#00875a',
            paidGreenHover: '#00a36c',
            pendingOrange: '#d97706',
            pendingOrangeHover: '#f59e0b',
            accentBlue: '#3b82f6'
          }
        }
      }
    }
  </script>

  <style>
    /* Estilização da barra de rolagem e prevenção de seleção acidental */
    body {
      background-color: #121318;
      color: #e2e8f0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-appDark text-gray-200 font-sans">

  <!-- CABEÇALHO SUPERIOR -->
  <header class="bg-appHeader border-b border-gray-800 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <button id="btn-menu" class="p-2 hover:bg-gray-800 rounded-lg text-gray-300">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
      <div class="flex items-center space-x-2">
        <h1 id="month-year-label" class="text-xl font-bold text-white capitalize">Outubro 2026</h1>
        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Botão Voltar para Hoje -->
      <button id="btn-today" class="px-3 py-1.5 text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-full border border-gray-700 transition">
        Hoje
      </button>
    </div>
  </header>

  <!-- CONTROLES DE NAVEGAÇÃO DE MÊS -->
  <div class="bg-appHeader/60 border-b border-gray-800/80 px-4 py-2 flex justify-between items-center text-sm">
    <button id="btn-prev-month" class="p-1 hover:bg-gray-800 rounded-md text-gray-400 hover:text-white flex items-center space-x-1">
      <i data-lucide="chevron-left" class="w-5 h-5"></i>
      <span class="hidden sm:inline">Anterior</span>
    </button>
    <div id="summary-month" class="text-xs font-medium text-gray-400">
      <span text-emerald-400 class="text-paidGreen font-bold" id="total-paid">Pago: R$ 0,00</span> | 
      <span text-amber-500 class="text-pendingOrange font-bold" id="total-pending">Pendente: R$ 0,00</span>
    </div>
    <button id="btn-next-month" class="p-1 hover:bg-gray-800 rounded-md text-gray-400 hover:text-white flex items-center space-x-1">
      <span class="hidden sm:inline">Próximo</span>
      <i data-lucide="chevron-right" class="w-5 h-5"></i>
    </button>
  </div>

  <!-- CABEÇALHO COM DIAS DA SEMANA -->
  <div class="grid grid-cols-7 bg-appHeader text-center py-2 border-b border-gray-800 text-xs font-bold text-gray-400">
    <div>dom.</div>
    <div>seg.</div>
    <div>ter.</div>
    <div>qua.</div>
    <div>qui.</div>
    <div>sex.</div>
    <div>sáb.</div>
  </div>

  <!-- GRADE DO CALENDÁRIO (AGENDA) -->
  <main id="calendar-grid" class="flex-1 grid grid-cols-7 auto-rows-fr gap-[1px] bg-gray-800/50 overflow-y-auto custom-scrollbar">
    <!-- Dias gerados via JavaScript -->
  </main>

  <!-- MODAL DE CADASTRO / EDIÇÃO DE CONTA -->
  <div id="modal-account" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-appCard border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-white">Nova Conta / Lançamento</h3>
        <button id="btn-close-modal" class="text-gray-400 hover:text-white">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form id="form-account" class="space-y-4">
        <input type="hidden" id="account-id" />
        
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Título / Descrição</label>
          <input type="text" id="account-title" required placeholder="Ex: Nubank, Netflix, Celular"
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-accentBlue" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" id="account-amount" placeholder="0,00"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-accentBlue" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Vencimento</label>
            <input type="date" id="account-date" required
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-accentBlue" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">Status do Pagamento</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center justify-center p-2.5 rounded-lg border border-gray-700 bg-gray-800 cursor-pointer text-sm font-medium has-[:checked]:bg-paidGreen has-[:checked]:border-emerald-400 transition">
              <input type="radio" name="account-status" value="paid" class="sr-only" id="status-paid" />
              <i data-lucide="check-circle" class="w-4 h-4 mr-2"></i> Pago (Verde)
            </label>
            <label class="flex items-center justify-center p-2.5 rounded-lg border border-gray-700 bg-gray-800 cursor-pointer text-sm font-medium has-[:checked]:bg-pendingOrange has-[:checked]:border-amber-400 transition">
              <input type="radio" name="account-status" value="pending" checked class="sr-only" id="status-pending" />
              <i data-lucide="clock" class="w-4 h-4 mr-2"></i> Pendente (Laranja)
            </label>
          </div>
        </div>

        <div class="flex justify-between items-center pt-2">
          <button type="button" id="btn-delete-account" class="text-red-400 hover:text-red-300 text-sm hidden flex items-center space-x-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            <span>Excluir</span>
          </button>

          <div class="flex space-x-2 ml-auto">
            <button type="button" id="btn-cancel-modal" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm font-medium">
              Cancelar
            </button>
            <button type="submit" class="px-4 py-2 bg-accentBlue hover:bg-blue-600 text-white rounded-lg text-sm font-medium transition">
              Salvar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPT DE INICIALIZAÇÃO E LÓGICA DO APP -->
  <script>
    // 1. Configuração do Banco de Dados Local (IndexedDB via Dexie)
    const db = new Dexie('FinanceAppDB');
    db.version(1).stores({
      accounts: '++id, title, amount, date, status'
    });

    // Estado Atual do Aplicativo
    let currentDate = new Date();
    
    // Elementos do DOM
    const calendarGrid = document.getElementById('calendar-grid');
    const monthYearLabel = document.getElementById('month-year-label');
    const modal = document.getElementById('modal-account');
    const formAccount = document.getElementById('form-account');
    const btnDeleteAccount = document.getElementById('btn-delete-account');

    // Inicialização do Lucide Icons
    function updateIcons() {
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Gerador Dinâmico de Manifest para PWA
    function setupPWA() {
      const manifest = {
        name: "Controle Financeiro Agenda",
        short_name: "Finanças",
        start_url: "./",
        display: "standalone",
        background_color: "#121318",
        theme_color: "#121318",
        icons: [{
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121318'/><text y='.9em' font-size='90'>📅</text></svg>",
          sizes: "192x192 512x512",
          type: "image/svg+xml"
        }]
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], {type: 'application/json'});
      document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(blob));
    }

    // Renderização do Calendário
    async function renderCalendar() {
      calendarGrid.innerHTML = '';
      
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Formatação do Título do Mês
      const monthName = new Intl.DateTimeFormat('pt-BR', { month: 'long' }).format(currentDate);
      monthYearLabel.textContent = `${monthName} ${year}`;

      // Primeiro dia do mês e total de dias
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();

      // Busca das Contas do Mês Atual no IndexedDB
      const startDateStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
      const endDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(daysInMonth).padStart(2, '0')}`;
      
      const accounts = await db.accounts
        .where('date')
        .between(startDateStr, endDateStr, true, true)
        .toArray();

      // Cálculo dos Totais do Mês
      let totalPaid = 0;
      let totalPending = 0;
      accounts.forEach(acc => {
        const val = parseFloat(acc.amount) || 0;
        if (acc.status === 'paid') totalPaid += val;
        else totalPending += val;
      });

      document.getElementById('total-paid').textContent = `Pago: R$ ${totalPaid.toFixed(2)}`;
      document.getElementById('total-pending').textContent = `Pendente: R$ ${totalPending.toFixed(2)}`;

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      // 1. Dias do Mês Anterior (para preenchimento)
      for (let i = firstDayOfMonth - 1; i >= 0; i--) {
        const dayNum = daysInPrevMonth - i;
        const cell = createDayCell(dayNum, true);
        calendarGrid.appendChild(cell);
      }

      // 2. Dias do Mês Atual
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = isCurrentMonth && today.getDate() === day;
        
        const dayAccounts = accounts.filter(acc => acc.date === dateStr);
        const cell = createDayCell(day, false, isToday, dateStr, dayAccounts);
        calendarGrid.appendChild(cell);
      }

      // 3. Dias do Próximo Mês (completar a grade)
      const totalCells = firstDayOfMonth + daysInMonth;
      const nextDays = (42 - totalCells) % 7; // Mantém grade uniforme
      for (let day = 1; day <= nextDays; day++) {
        const cell = createDayCell(day, true);
        calendarGrid.appendChild(cell);
      }

      updateIcons();
    }

    // Criação dos Blocos dos Dias no Calendário
    function createDayCell(dayNumber, isOtherMonth = false, isToday = false, dateStr = null, dayAccounts = []) {
      const cell = document.createElement('div');
      cell.className = `min-h-[90px] p-1 border-b border-r border-gray-800/40 flex flex-col justify-between ${
        isOtherMonth ? 'bg-appDark/40 text-gray-600' : 'bg-appDark text-gray-200'
      } cursor-pointer hover:bg-gray-800/30 transition relative`;

      // Clique no dia abre o modal para adicionar nova conta naquela data
      if (!isOtherMonth && dateStr) {
        cell.addEventListener('click', (e) => {
          // Impede abertura do modal do dia ao clicar em uma conta específica
          if (e.target.closest('.account-badge')) return;
          openModalForDate(dateStr);
        });
      }

      // Cabeçalho do dia (Número do Dia)
      const topRow = document.createElement('div');
      topRow.className = 'flex justify-start p-1';

      const dayNumSpan = document.createElement('span');
      dayNumSpan.className = `text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full ${
        isToday ? 'bg-accentBlue text-white shadow-md' : ''
      }`;
      dayNumSpan.textContent = dayNumber;
      topRow.appendChild(dayNumSpan);
      cell.appendChild(topRow);

      // Lista de Contas / Lançamentos
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'space-y-1 overflow-y-auto max-h-[75px] custom-scrollbar flex-1';

      dayAccounts.forEach(acc => {
        const badge = document.createElement('div');
        const isPaid = acc.status === 'paid';
        badge.className = `account-badge text-[10px] font-semibold px-2 py-1 rounded text-white truncate flex items-center justify-between shadow-sm border ${
          isPaid 
            ? 'bg-paidGreen border-emerald-600 hover:bg-paidGreenHover' 
            : 'bg-pendingOrange border-amber-600 hover:bg-pendingOrangeHover'
        }`;
        
        badge.innerHTML = `
          <span class="truncate">${acc.title}</span>
        `;

        // Clique no badge permite editar a conta existente
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          openModalForEdit(acc);
        });

        badgeContainer.appendChild(badge);
      });

      cell.appendChild(badgeContainer);
      return cell;
    }

    // Modal - Abertura para Novo Cadastro
    function openModalForDate(dateStr) {
      formAccount.reset();
      document.getElementById('account-id').value = '';
      document.getElementById('account-date').value = dateStr;
      document.getElementById('modal-title').textContent = 'Nova Conta';
      document.getElementById('status-pending').checked = true;
      btnDeleteAccount.classList.add('hidden');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // Modal - Abertura para Edição
    function openModalForEdit(acc) {
      document.getElementById('account-id').value = acc.id;
      document.getElementById('account-title').value = acc.title;
      document.getElementById('account-amount').value = acc.amount || '';
      document.getElementById('account-date').value = acc.date;
      document.getElementById('modal-title').textContent = 'Editar Conta';

      if (acc.status === 'paid') {
        document.getElementById('status-paid').checked = true;
      } else {
        document.getElementById('status-pending').checked = true;
      }

      btnDeleteAccount.classList.remove('hidden');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // Modal - Fechamento
    function closeModal() {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Eventos e Submissão do Formulário
    formAccount.addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('account-id').value;
      const title = document.getElementById('account-title').value;
      const amount = document.getElementById('account-amount').value;
      const date = document.getElementById('account-date').value;
      const status = document.querySelector('input[name="account-status"]:checked').value;

      const accountData = { title, amount, date, status };

      if (id) {
        await db.accounts.update(parseInt(id), accountData);
      } else {
        await db.accounts.add(accountData);
      }

      closeModal();
      renderCalendar();
    });

    // Exclusão de Conta
    btnDeleteAccount.addEventListener('click', async () => {
      const id = document.getElementById('account-id').value;
      if (id && confirm('Deseja realmente excluir esta conta?')) {
        await db.accounts.delete(parseInt(id));
        closeModal();
        renderCalendar();
      }
    });

    // Navegação entre Meses
    document.getElementById('btn-prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('btn-next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('btn-today').addEventListener('click', () => {
      currentDate = new Date();
      renderCalendar();
    });

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeModal);

    // Inicialização da Aplicação
    window.addEventListener('DOMContentLoaded', () => {
      setupPWA();
      renderCalendar();
    });
  </script>
</body>
</html>
